<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Mobile browsers need an explicit viewport or they render at ~980px and scale down. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="author" content="eugenio arosteguy">
    <meta name="description" content="¡Protege la comida del picnic de las hambrientas hormigas en este juego de inclinación!">
    <meta name="theme-color" content="#172312">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ants Feast">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Ants Feast</title>
    <script src="dist/bundle.js?v=21"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").then((reg) => {
            reg.update();
          }).catch((err) => {
            console.warn("ServiceWorker registration failed:", err);
          });
        });
      }
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #172312;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
  </body>
</html>
